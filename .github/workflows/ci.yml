name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-em-en-dashes:
    name: No em or en dashes in project copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for em (U+2014) and en (U+2013) dashes
        run: python3 scripts/check-no-dashes.py

  web-typecheck:
    name: apps/web TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  api-import-check:
    name: apps/api Python import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify the app module imports cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          JWT_SECRET_KEY: ci-placeholder-secret
        run: python3 -c "import app.main"
